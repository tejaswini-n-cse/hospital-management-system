{% extends "base.html" %}

{% block title %}Login{% endblock %}

{% block content %}
  <div class="form-box">
    <h2>Login</h2>
    <form method="post">
      {% csrf_token %}
      {{ form.as_p }}
      <button type="submit" class="btn">Login</button>
    </form>
    <p style="margin-top:14px">New patient? <a href="{% url 'register' %}">Create an account</a></p>
  </div>
{% endblock %}
